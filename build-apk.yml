
name: Build AVI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Check AVI manifest
        run: |
          curl -fL https://avi-assistant.onrender.com/manifest.json -o manifest.json
          cat manifest.json

      - name: Initialize Android project
        run: |
          mkdir android-app
          cd android-app
          bubblewrap init --manifest https://avi-assistant.onrender.com/manifest.json
