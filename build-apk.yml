
name: Build AVI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create Android project with Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest https://avi-assistant.onrender.com/manifest.json
